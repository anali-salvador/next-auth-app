<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ddff"/>
      <stop offset=".5" stop-color="#ffd9e8"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3edff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b6ff"/>
      <stop offset=".55" stop-color="#ffc2dc"/>
      <stop offset="1" stop-color="#ffdcb8"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f0ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#8b6fd6" flood-opacity=".28"/>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="270" fill="url(#bg)"/>
  <circle cx="470" cy="140" r="60" fill="#fff" opacity=".45"/>
  <circle cx="120" cy="450" r="80" fill="#c8f5dc" opacity=".7"/>
  <!-- nubes -->
  <g fill="#fff" opacity=".9">
    <path d="M70 210a32 32 0 0 1 58-18 26 26 0 0 1 44 20 22 22 0 0 1-2 44H82a26 26 0 0 1-12-46z"/>
    <path d="M430 470a26 26 0 0 1 46-14 20 20 0 0 1 34 16 18 18 0 0 1-2 36h-70a20 20 0 0 1-8-38z"/>
  </g>
  <!-- teléfono -->
  <g filter="url(#soft)">
    <rect x="195" y="90" width="210" height="420" rx="42" fill="url(#phone)"/>
    <rect x="211" y="106" width="178" height="388" rx="30" fill="url(#screen)"/>
    <rect x="268" y="118" width="64" height="12" rx="6" fill="#ffffff" opacity=".7"/>
  </g>
  <!-- candado -->
  <g filter="url(#soft)">
    <path d="M262 268v-30a38 38 0 0 1 76 0v30" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <rect x="240" y="262" width="120" height="104" rx="28" fill="url(#lock)"/>
    <circle cx="300" cy="306" r="13" fill="#9b7ff0"/>
    <rect x="294" y="312" width="12" height="28" rx="6" fill="#9b7ff0"/>
  </g>
  <!-- puntos de contraseña -->
  <g fill="#ffffff">
    <circle cx="258" cy="410" r="9"/><circle cx="286" cy="410" r="9"/>
    <circle cx="314" cy="410" r="9"/><circle cx="342" cy="410" r="9" opacity=".5"/>
  </g>
  <rect x="236" y="440" width="128" height="26" rx="13" fill="#ffffff" opacity=".85"/>
  <!-- estrellas -->
  <g fill="#ffd36e">
    <path d="M500 280l7 16 16 7-16 7-7 16-7-16-16-7 16-7z"/>
    <path d="M110 120l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
    <path d="M460 400l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ff9ec4"/>
    <path d="M150 330l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#a98bff"/>
  </g>
</svg>
